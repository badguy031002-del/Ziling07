<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ขอเป็นแฟนนะ 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg1:#4a1f9a;--bg2:#c9b3f5;--card:#fff;--ink:#3b1f6b;--pink:#7c3aed;--soft:#c4a6ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Mitr','Noto Sans Thai',sans-serif;background:linear-gradient(170deg,var(--bg1) 0%,#7a4fd6 45%,var(--bg2) 100%);background-attachment:fixed;color:#fff;overflow:hidden;-webkit-tap-highlight-color:transparent}
#amb{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.screen{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));gap:20px}
.screen.on{display:flex;animation:fade .7s ease}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{text-shadow:0 2px 12px rgba(40,10,90,.35);font-weight:500;font-size:clamp(24px,6.5vw,38px);margin:0;line-height:1.5}
p{margin:0;font-size:17px;line-height:1.8}
.msg,.letter,.thanks{color:var(--ink)}
.msg h1,.letter h1,.thanks h1{text-shadow:none}
.btn{font-family:inherit;font-size:18px;border:0;border-radius:999px;padding:12px 30px;cursor:pointer;background:var(--pink);color:#fff;box-shadow:0 6px 18px rgba(76,29,149,.45);transition:transform .15s}
.btn:active{transform:scale(.94)}
.btn.alt{background:var(--card);color:var(--pink);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.btn.glow{animation:glow 1.6s ease-in-out infinite}
.btn.hide{display:none}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(255,255,255,.22),0 6px 22px rgba(124,58,237,.6);transform:scale(1.06)}}
/* page 1 heart */
.big{font-size:64px;padding:14px;animation:beat 1.2s infinite;filter:drop-shadow(0 0 18px rgba(255,160,220,.8));position:relative;line-height:1}
@keyframes beat{14%{transform:scale(1.18)}28%{transform:scale(1)}42%{transform:scale(1.14)}70%{transform:scale(1)}}
.big.ready{cursor:pointer;filter:drop-shadow(0 0 26px rgba(255,190,235,1));animation-duration:.9s}
.ring{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:2px solid rgba(255,255,255,.7);animation:ring 2.4s ease-out infinite;pointer-events:none}
.ring:nth-child(2){animation-delay:.8s}.ring:nth-child(3){animation-delay:1.6s}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(3.2);opacity:0}}
.line{opacity:0;animation:rise .9s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.phones{display:inline-block;animation:wob 1.4s ease-in-out infinite}
@keyframes wob{25%{transform:rotate(-14deg) scale(1.15)}75%{transform:rotate(14deg) scale(1.15)}}
#fl{min-height:36px;font-size:22px;font-weight:400;opacity:0;transition:opacity .6s ease;text-shadow:0 2px 12px rgba(40,10,90,.45)}
#fl.final{text-shadow:0 0 18px rgba(255,200,240,.9),0 2px 12px rgba(40,10,90,.45)}
#fl.tap{cursor:pointer;padding:12px 26px;border-radius:999px;background:rgba(255,255,255,.2);box-shadow:0 0 0 0 rgba(255,255,255,.35);animation:tapglow 1.6s ease-in-out infinite}
@keyframes tapglow{50%{box-shadow:0 0 0 12px rgba(255,255,255,0),0 0 22px rgba(255,200,240,.7);transform:scale(1.05)}}
.gate h1{font-size:clamp(26px,7.5vw,42px)}
.gate .big{font-size:78px}
#mhint{position:fixed;top:max(16px,env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:30;font-size:17px;opacity:0;pointer-events:none;transition:opacity .6s;text-shadow:0 2px 10px rgba(40,10,90,.5)}
#mhint.on{opacity:1;animation:blink 1.6s ease-in-out infinite}
/* envelope + letter page */
.env{position:relative;width:min(280px,76vw);height:190px;cursor:pointer;animation:float 2.4s ease-in-out infinite;perspective:600px}
@keyframes float{50%{transform:translateY(-8px)}}
.env::before{content:"";position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(255,220,250,.55),transparent 65%);animation:pulse 2s ease-in-out infinite;z-index:-1}
@keyframes pulse{50%{transform:scale(1.15);opacity:.6}}
.env .body{position:absolute;inset:0;background:var(--soft);border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.2)}
.env .flap{position:absolute;left:0;right:0;top:0;height:100px;background:#8b5cf6;clip-path:polygon(0 0,100% 0,50% 100%);border-radius:10px 10px 0 0;transform-origin:top;transition:transform .7s ease}
.env .heart{position:absolute;left:50%;top:78px;transform:translateX(-50%);font-size:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));transition:transform .6s ease;animation:hb 1.2s infinite;padding:10px;line-height:1}
@keyframes hb{50%{font-size:40px}}
.env.open .flap{transform:rotateX(180deg)}
.env.open .heart{transform:translate(-50%,-70px) scale(1.8)}
.env.away{opacity:0;transform:translateY(40px) scale(.85);transition:opacity .6s ease,transform .6s ease;animation:none;pointer-events:none}
.hint{font-size:15px;opacity:.9;animation:blink 1.8s ease-in-out infinite;min-height:22px}
@keyframes blink{50%{opacity:.45}}
.msg{display:none;background:var(--card);border-radius:18px;padding:22px 20px;max-width:380px;width:100%;max-height:66vh;overflow-y:auto;text-align:left;box-shadow:0 0 40px rgba(255,200,240,.35),0 14px 34px rgba(0,0,0,.18)}
.msg.on{display:block;animation:letterUp .9s ease}
@keyframes letterUp{from{opacity:0;transform:translateY(70px) scale(.85)}to{opacity:1;transform:none}}
.msg.fold{transition:transform .9s cubic-bezier(.6,0,.4,1),opacity .5s ease .4s;transform:scale(.2,.28) rotate(-10deg);opacity:0}
.msg p{font-size:15.5px;line-height:1.85}
.w{opacity:0;transition:opacity .8s ease}
.w.v{opacity:1}
/* paper rocket */
.prock{position:fixed;z-index:40;width:70px;height:122px;opacity:0;pointer-events:none;transform-origin:50% 55%;filter:drop-shadow(0 6px 8px rgba(40,10,90,.3))}
.prock.show{opacity:1;animation:unfold .7s ease forwards,hov 1.2s ease-in-out .7s infinite}
@keyframes unfold{from{opacity:0;transform:scale(.2,.6) rotate(-12deg)}to{opacity:1;transform:scale(1.15) rotate(0)}}
@keyframes hov{0%,100%{transform:scale(1.15) translateY(0) rotate(-4deg)}50%{transform:scale(1.15) translateY(-8px) rotate(4deg)}}
.prock svg{width:100%;height:100%;overflow:visible}
.prock .pf{opacity:0;transform-box:fill-box;transform-origin:top center}
.prock.fly .pf{opacity:1;animation:flame .15s ease-in-out infinite alternate}
@keyframes flame{from{transform:scaleY(.8)}to{transform:scaleY(1.4)}}
/* panda balloon */
.pwrap{position:absolute;left:0;right:0;top:30%;height:0;display:flex;justify-content:center;pointer-events:none}
#panda{display:none;position:relative;width:min(210px,56vw);margin-top:-165px;filter:drop-shadow(0 12px 18px rgba(40,10,90,.35))}
#panda.show{display:block;animation:floatIn 2.8s cubic-bezier(.2,.7,.3,1) forwards,bob 3s ease-in-out 2.8s infinite}
#panda svg{display:block;width:100%;height:auto}
@keyframes floatIn{from{transform:translateY(85vh) rotate(-8deg);opacity:0}15%{opacity:1}to{transform:translateY(0) rotate(0);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
#panda.popped{visibility:hidden}
.frag{position:fixed;z-index:60;pointer-events:none;border-radius:50%;animation:sp .9s ease-out forwards}
.flash{position:fixed;z-index:59;pointer-events:none;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);animation:flash .5s ease-out forwards}
@keyframes flash{from{transform:scale(.3);opacity:1}to{transform:scale(2.4);opacity:0}}
/* question card */
.letter{position:relative;background:var(--card);border-radius:18px;padding:30px 24px;max-width:340px;width:100%;box-shadow:0 0 40px rgba(255,200,240,.4),0 14px 34px rgba(0,0,0,.18)}
.letter h1{font-size:clamp(22px,6vw,30px)}
.letter .em{display:inline-block;font-size:42px;animation:beat 1.2s infinite}
.row{display:flex;gap:16px;justify-content:center;align-items:center;margin-top:24px;min-height:52px}
#cap{margin-top:14px;min-height:24px;font-size:15px;color:var(--pink);opacity:.9}
#no.fly{position:fixed;z-index:10;transition:left .25s ease,top .25s ease;margin:0}
/* finale */
#s5{overflow:hidden}
#fw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fenv{position:relative;width:min(280px,76vw);height:190px;transition:transform 1.1s ease-in,opacity .9s ease-in .4s;z-index:2}
.fenv .body{position:absolute;inset:0;background:var(--soft);border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.2)}
.fenv .flap{position:absolute;left:0;right:0;top:0;height:100px;background:#8b5cf6;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transform:rotateX(180deg);transition:transform .9s ease}
.fenv.closed .flap{transform:rotateX(0)}
.fenv.gone{transform:translateY(60vh);opacity:0}
.fin{position:relative;z-index:3;display:none;flex-direction:column;align-items:center;gap:14px;max-width:360px}
.fin.on{display:flex;animation:fade 1s ease}
.date{font-size:28px;color:#fff;font-weight:500;text-shadow:0 2px 12px rgba(40,10,90,.4)}
.thanks{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:0 0 40px rgba(255,200,240,.4),0 10px 26px rgba(0,0,0,.18)}
.balloons{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.b{position:absolute;bottom:-150px;width:80px;height:96px;border-radius:50% 50% 48% 48%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#fff;text-align:center;line-height:1.2;text-shadow:0 1px 4px rgba(0,0,0,.35);animation:bup linear infinite}
.b.inf{font-size:34px}
.b::after{content:"";position:absolute;top:100%;left:50%;width:1px;height:44px;background:rgba(255,255,255,.55)}
@keyframes bup{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-70vh) translateX(16px)}100%{transform:translateY(-130vh) translateX(-10px)}}
/* tap sparkles */
.sp{position:fixed;z-index:50;pointer-events:none;font-size:18px;animation:sp 1s ease-out forwards}
@keyframes sp{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--r));opacity:0}}
.up{position:fixed;z-index:0;pointer-events:none;animation:upk linear forwards}
@keyframes upk{from{transform:translateY(0) scale(.6);opacity:.9}to{transform:translateY(-220px) scale(1.2);opacity:0}}
</style>
</head>

<script>
/* ---------- music: tries to play as soon as the page opens, and always starts at the first touch
   (the "พร้อมแล้วววว" button is that touch) ---------- */
var bgm=document.getElementById('bgm'),everPlayed=false;
var gestureEvents=['pointerdown','touchstart','touchend','click','keydown'];
function startMusic(){var p=bgm.play();if(p&&p.catch)p.catch(function(){});}
function onGesture(){startMusic();}
bgm.addEventListener('playing',function(){
  everPlayed=true;
  gestureEvents.forEach(function(ev){document.removeEventListener(ev,onGesture)});
});
gestureEvents.forEach(function(ev){document.addEventListener(ev,onGesture,{passive:true})});
startMusic();
bgm.addEventListener('canplaythrough',function(){if(bgm.paused&&!document.hidden)startMusic();},{once:true});
window.addEventListener('load',startMusic);
document.addEventListener('visibilitychange',function(){
  if(document.hidden)bgm.pause();else if(everPlayed)startMusic();
});

/* ---------- navigation ---------- */
var MSG="พี่รักหนูมากเลยนะ รักมากจริงๆ 🥺💗 จริงๆ พี่ตั้งใจไว้ว่าจะไปขอหนูเป็นแฟนด้วยตัวเองนะ อยากไปยืนอยู่ตรงหน้าหนู อยากพูดทุกอย่างให้หนูฟังด้วยตัวพี่เองเลย แต่ตอนนี้พี่ยังไม่มีเงินมากพอจริงๆ พี่ก็พยายามหาเงิน พยายามเตรียมทุกอย่างให้ดีที่สุดเท่าที่พี่จะทำได้ เพราะพี่อยากให้วันที่พี่ขอหนูเป็นแฟน มันเป็นวันที่พี่ตั้งใจทำให้หนูมีความสุข ไม่ใช่แค่วันที่พี่พูดออกไปว่ารักหนูแค่ไหน พี่ขอโทษนะคะที่ตอนนี้พี่ยังดูแลตัวเองได้ไม่ดีเท่าที่ควร บางครั้งพี่ก็แอบเสียใจเหมือนกันที่ตัวเองยังทำอะไรได้ไม่มากอย่างที่ใจอยากทำ พี่อยากเป็นคนที่ดูแลหนูได้ดี อยากเป็นคนที่ทำให้หนูรู้สึกมั่นคงและสบายใจเวลามีพี่อยู่ข้างๆ พี่รู้ว่าพี่ยังมีหลายอย่างที่ต้องปรับปรุง แต่พี่อยากค่อยๆ พัฒนาตัวเอง ปรับปรุงตัวเอง แล้วก็พยายามทำให้ตัวเองดีขึ้นในทุกๆ วันนะคะ พี่อาจจะยังไม่ใช่คนที่ดีที่สุดในวันนี้ แต่พี่อยากเป็นคนที่ดีขึ้นเพื่อหนูและเพื่อตัวพี่เองด้วยนะคะ ช่วงนี้พี่คิดมากหลายเรื่องเลย ทั้งเรื่องเงิน ทั้งเรื่องที่พยายามวางแผนว่าจะขึ้นไปขอหนูเป็นแฟนยังไงให้ดีที่สุด บางทีพี่ก็เหนื่อยกับความคิดตัวเองเหมือนกัน แต่ถึงจะคิดมากแค่ไหน สิ่งหนึ่งที่พี่ไม่เคยลังเลเลยก็คือความรู้สึกที่พี่มีให้หนู พี่ยังอยากมีหนูอยู่ในชีวิตเหมือนเดิม แล้วก็อยากให้เราได้เดินไปด้วยกันอีกนานๆ พี่ไม่อยากให้เราต้องห่างกันเลยนะ พี่ยอมรับว่าบางครั้งพี่ก็น้อยใจบ้าง คิดมากบ้าง กลัวบ้างเหมือนกัน แต่พี่เข้าใจหนูนะคะที่หนูหายไปบ่อยๆ 😢 พี่ไม่อยากให้ความรู้สึกของพี่กลายเป็นความกดดันของหนู เพราะพี่อยากให้หนูมีความสุขกับการมีพี่อยู่จริงๆ ไม่ใช่ต้องตอบตกลงเพราะสงสาร หรือเพราะกลัวว่าพี่จะเสียใจ แต่มีเรื่องหนึ่งที่พี่อยากบอกหนูมากๆ เลยนะ พี่อยากคบกับหนูในเดือนนี้จริงๆ 🥺 เพราะเราเกิดเดือนเดียวกัน แล้วพี่ก็รู้สึกว่าถ้าเราได้เริ่มต้นความสัมพันธ์กันในเดือนเดียวกับที่เราเกิด มันคงเป็นความทรงจำที่พิเศษมากเลยในทุกปี ไม่รู้ว่าหนูจะมองว่ามันไร้สาระมั้ย จริงๆพี่ตั้งใจว่าจะขอหนูวันนี้ด้วยแหละ แต่พี่ก็ไม่รู้ว่าหนูพร้อมรึยัง ไม่รู้ว่าหนูคิดเหมือนพี่มั้ย แล้วก็ไม่รู้ด้วยว่าถ้าพี่พูดทุกอย่างออกไป หนูจะรู้สึกยังไง พี่เลยมีทั้งความสุข ทั้งตื่นเต้น แล้วก็แอบกลัวอยู่เหมือนกัน พี่อยากให้หนูรู้ว่าพี่ตั้งใจกับความสัมพันธ์ครั้งนี้มากแค่ไหน พี่สัญญาว่าพี่จะพยายาม เป็นคนที่ดีขึ้น และจะไม่หยุดพัฒนาตัวเองเพียงเพราะคิดว่าหนูรักพี่แล้วหรือเป็นแฟนกับพี่แล้ว พี่อยากให้หนูได้เห็นว่าคนที่หนูเลือกในวันนี้จะค่อยๆ เติบโตไปเป็นคนที่ดีกว่าเดิมได้จริงๆ สุดท้ายนี้ พี่อยากบอกหนูว่า พี่รักหนูนะ รักที่สุดในโลกเลย รักจนอยากมีหนูอยู่ในวันธรรมดาๆ อยากตื่นเช้ามาเห็นหนูในทุกๆเช้าของพี่ อยากเล่าเรื่องเล็กๆน้อยๆ ให้หนูฟัง อยากเป็นคนที่หนูคิดถึงเวลามีความสุข แล้วก็เป็นคนที่หนูหันมาหาได้ในวันที่เหนื่อยหรือเศร้า พี่อยากดูแลความรู้สึกของหนู อยากเรียนรู้หนูให้มากขึ้น และอยากสร้างความทรงจำดีๆ ไปด้วยกันอีกเยอะเลย พี่ไม่รู้ว่าหนูจะตอบพี่ยังไง แต่พี่อยากถามจากใจจริงๆ ว่าหนูจะตกลงเป็นแฟนกับพี่ได้มั้ยคะ🥺💗พี่อยากให้เราได้เริ่มต้นความสัมพันธ์นี้ไปด้วยกันนะ ไม่ใช่เพราะพี่กลัวการเสียหนูไป แต่เพราะพี่มีความสุขจริงๆ ที่มีหนูอยู่ และพี่อยากตั้งใจรักหนูในฐานะแฟนให้ดีที่สุดเท่าที่พี่คนนี้จะทำได้เลยนะคะ💗 ตื่นเต้นจาง🥺";
function go(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on')});
  document.getElementById(id).classList.add('on');
}

/* ---------- start page: "พร้อมแล้วววว" (this tap also starts the song) ---------- */
var started=false;
function ready(){
  if(started)return;started=true;
  startMusic();
  var b=document.querySelector('#s0 .btn'),r=b.getBoundingClientRect();
  for(var i=0;i<10;i++)sparkle(r.left+r.width/2,r.top+r.height/2);
  setTimeout(function(){go('s1');beginIntro();},300);
}

/* ---------- page 1: floating messages, then tap "ลองเข้ามาในใจสิ" ---------- */
var textReady=false,fl=document.getElementById('fl');
function showFl(text,hold,next){
  fl.textContent=text;fl.style.opacity=1;
  if(hold){setTimeout(function(){fl.style.opacity=0;setTimeout(next,700);},hold);}
  else if(next){next();}
}
function beginIntro(){
  setTimeout(function(){
    showFl('เขินจัง😜',2000,function(){
      showFl('ไม่เคยทำแบบนี้เลยนะ',2000,function(){
        fl.classList.add('final');
        showFl('ลองเข้ามาในใจสิ',0,function(){textReady=true;fl.classList.add('tap');});
      });
    });
  },2800);
}
fl.addEventListener('click',function(){
  if(!textReady)return;
  textReady=false;
  var r=fl.getBoundingClientRect();
  for(var i=0;i<12;i++)sparkle(r.left+r.width/2,r.top+r.height/2);
  setTimeout(function(){go('s2')},350);
});

/* ---------- page 2: envelope -> letter ---------- */
var envBusy=false,autoScroll=true,revealTimer=null;
function openEnv(){
  if(envBusy)return;envBusy=true;
  var e=document.getElementById('env');
  e.classList.add('open');
  document.getElementById('hint').style.display='none';
  var r=e.getBoundingClientRect();
  for(var i=0;i<14;i++)sparkle(r.left+r.width/2,r.top+r.height/2);
  setTimeout(function(){e.classList.add('away')},1000);
  setTimeout(function(){
    e.style.display='none';
    document.getElementById('msg').classList.add('on');
    document.getElementById('nextBtn').classList.remove('hide');
    revealMsg();
  },1600);
}
function revealMsg(){
  var p=document.getElementById('msgText'),box=document.getElementById('msg');
  if(p.childNodes.length)return;
  var words=MSG.split(' '),spans=[];
  words.forEach(function(w,i){
    var s=document.createElement('span');s.className='w';s.textContent=w;
    p.appendChild(s);if(i<words.length-1)p.appendChild(document.createTextNode(' '));
    spans.push(s);
  });
  ['touchstart','wheel','mousedown'].forEach(function(ev){box.addEventListener(ev,function(){autoScroll=false},{passive:true})});
  var i=0;
  revealTimer=setInterval(function(){
    if(i>=spans.length){clearInterval(revealTimer);return;}
    spans[i++].classList.add('v');
    if(autoScroll)box.scrollTop=box.scrollHeight;
  },100);
  box.onclick=function(){clearInterval(revealTimer);spans.forEach(function(s){s.classList.add('v')});};
}

/* ---------- letter folds into a paper rocket, flies, pops the panda balloon ---------- */
var sent=false,popped=false,rkCx=0,rkCy=0;
function nextLetter(){
  if(sent)return;sent=true;
  clearInterval(revealTimer);
  var msg=document.getElementById('msg'),rk=document.getElementById('prock');
  document.getElementById('nextBtn').classList.add('hide');
  var r=msg.getBoundingClientRect();
  rkCx=r.left+r.width/2;rkCy=r.top+r.height/2;
  rk.style.left=(rkCx-35)+'px';rk.style.top=(rkCy-61)+'px';
  msg.classList.add('fold');
  setTimeout(function(){rk.classList.add('show');for(var i=0;i<8;i++)sparkle(rkCx,rkCy);},450);
  setTimeout(function(){document.getElementById('panda').classList.add('show');},500);
  setTimeout(launchRocket,3600);
}
function launchRocket(){
  var rk=document.getElementById('prock'),pd=document.getElementById('panda').getBoundingClientRect();
  var tx=pd.left+pd.width/2,ty=pd.top+pd.height*.36;
  var dx=tx-rkCx,dy=ty-rkCy,ang=Math.atan2(dx,-dy)*180/Math.PI;
  rk.classList.add('fly');
  rk.style.animation='none';
  void rk.offsetWidth;
  rk.style.transition='transform 1.1s cubic-bezier(.55,0,.85,.55)';
  rk.style.transform='translate('+dx+'px,'+dy+'px) rotate('+ang+'deg) scale(1.15)';
  setTimeout(function(){
    rk.style.transition='opacity .12s';rk.style.opacity=0;
    popPanda();
  },1100);
}
function popPanda(){
  if(popped)return;popped=true;
  var pd=document.getElementById('panda'),r=pd.getBoundingClientRect();
  var cx=r.left+r.width/2,cy=r.top+r.height*.36;
  pd.classList.add('popped');
  var f=document.createElement('div');f.className='flash';
  f.style.cssText='left:'+(cx-90)+'px;top:'+(cy-90)+'px;width:180px;height:180px';
  document.body.appendChild(f);setTimeout(function(){f.remove()},600);
  var cols=['#2b2233','#ffffff','#ff9ad5','#e0b0ff','#2b2233','#ffffff'];
  for(var i=0;i<36;i++){
    var s=document.createElement('span');s.className='frag';
    var sz=6+Math.random()*10;
    s.style.width=sz+'px';s.style.height=sz+'px';
    s.style.background=cols[i%cols.length];
    s.style.left=(cx+(Math.random()*70-35))+'px';s.style.top=(cy+(Math.random()*70-35))+'px';
    var a=Math.random()*Math.PI*2,d=70+Math.random()*130;
    s.style.setProperty('--dx',Math.cos(a)*d+'px');
    s.style.setProperty('--dy',Math.sin(a)*d+'px');
    s.style.setProperty('--r','0deg');
    document.body.appendChild(s);(function(el){setTimeout(function(){el.remove()},1000)})(s);
  }
  for(var j=0;j<12;j++)sparkle(cx,cy);
  setTimeout(function(){go('s4')},1100);
}

/* ---------- page 4: "maybe not yet" runs away (never over any text) ---------- */
var clicks=0,no=document.getElementById('no'),cap=document.getElementById('cap');
var caps=['กดไม่โดน','คิดอีกทีนึงนะ','มันซนอะ😝','ก็มันดื้ออะ','จะกดตกลงแล้วกดผิดสินะ','ขอร้องนะ🥺','มันดิ้นอะ','เป็นแฟนกานนะ','ม่ายให้กดนะ','ตกลงเถอะนะคะ🥺'];
function placeNo(){
  var w=no.offsetWidth,h=no.offsetHeight,vw=window.innerWidth,vh=window.innerHeight,m=12,top=56,pad=14;
  var cr=document.getElementById('letter').getBoundingClientRect(),best=null;
  for(var i=0;i<150;i++){
    var x=m+Math.random()*(vw-w-2*m),y=top+Math.random()*(vh-h-top-m);
    var hit=x<cr.right+pad&&x+w>cr.left-pad&&y<cr.bottom+pad&&y+h>cr.top-pad;
    if(!hit){best={x:x,y:y};break;}
  }
  if(!best){
    var above=cr.top-pad-top-h,below=vh-(cr.bottom+pad)-h-m;
    var x2=m+Math.random()*(vw-w-2*m);
    best=below>=above?{x:x2,y:cr.bottom+pad+Math.random()*Math.max(0,below)}:{x:x2,y:top+Math.random()*Math.max(0,above)};
  }
  no.style.left=best.x+'px';no.style.top=best.y+'px';
}
function dodge(){
  if(clicks>=10){yes();return;}      // round 10 already turned it into "ตกลง" -> this tap accepts
  clicks++;
  cap.textContent=caps[clicks-1]||'';
  if(!no.classList.contains('fly')){
    var w=no.offsetWidth,h=no.offsetHeight,r=no.getBoundingClientRect();
    var ph=document.createElement('span');
    ph.style.cssText='display:inline-block;width:'+w+'px;height:'+h+'px';
    no.parentNode.insertBefore(ph,no);
    no.classList.add('fly');
    no.style.left=r.left+'px';no.style.top=r.top+'px';
    void no.offsetWidth;
  }
  placeNo();
  if(clicks===10){no.textContent='ตกลง';no.classList.remove('alt');}
}

/* ---------- finale ---------- */
var finale=false;
function yes(){
  if(finale)return;finale=true;
  no.style.display='none';
  go('s5');
  var env=document.getElementById('fenv');
  setTimeout(function(){env.classList.add('closed')},500);
  setTimeout(function(){env.classList.add('gone')},1500);
  setTimeout(function(){
    env.style.display='none';
    document.getElementById('fin').classList.add('on');
    balloons();fireworks();
  },2700);
}
function balloons(){
  var box=document.getElementById('balloons');
  var cols=['#ff7eb6','#ffcf4d','#b583ff','#5fd0f0','#ff9ad5','#e0b0ff','#ffa07a','#8b5cf6'];
  for(var i=0;i<18;i++){
    var b=document.createElement('div');
    b.className='b'+(i%2?' inf':'');
    b.style.left=(2+Math.random()*86)+'%';
    b.style.background=cols[i%cols.length];
    b.style.animationDuration=(10+Math.random()*7)+'s';
    b.style.animationDelay=(-Math.random()*14)+'s';
    b.textContent=(i%2)?'∞':'26/10/19';
    box.appendChild(b);
  }
}
function fireworks(){
  var c=document.getElementById('fw'),x=c.getContext('2d'),P=[];
  function size(){c.width=innerWidth;c.height=innerHeight}
  size();addEventListener('resize',size);
  var cols=['#ff7eb6','#ffd166','#7bdff2','#e0b0ff','#ffffff','#a78bfa'];
  function burst(){
    var cx=60+Math.random()*(c.width-120),cy=60+Math.random()*(c.height*.5),col=cols[(Math.random()*cols.length)|0],heart=Math.random()<.35;
    for(var i=0;i<46;i++){
      var a=Math.PI*2*i/46,s=1.5+Math.random()*3,vx=Math.cos(a)*s,vy=Math.sin(a)*s;
      if(heart){var t=a;vx=16*Math.pow(Math.sin(t),3)/6;vy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/6;}
      P.push({x:cx,y:cy,vx:vx,vy:vy,l:1,c:col});
    }
  }
  setInterval(burst,650);burst();burst();
  (function loop(){
    x.clearRect(0,0,c.width,c.height);
    P=P.filter(function(p){return p.l>0});
    P.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.vx*=.985;p.l-=.011;
      x.globalAlpha=Math.max(p.l,0);x.fillStyle=p.c;
      x.beginPath();x.arc(p.x,p.y,2.4,0,7);x.fill();
    });
    requestAnimationFrame(loop);
  })();
}

/* ---------- romantic extras on every page ---------- */
var SP=['💖','💗','💕','✨','💜','🌸'];
function sparkle(px,py){
  var s=document.createElement('span');s.className='sp';
  s.textContent=SP[(Math.random()*SP.length)|0];
  s.style.left=px+'px';s.style.top=py+'px';
  var a=Math.random()*Math.PI*2,d=40+Math.random()*60;
  s.style.setProperty('--dx',Math.cos(a)*d+'px');
  s.style.setProperty('--dy',Math.sin(a)*d-30+'px');
  s.style.setProperty('--r',(Math.random()*60-30)+'deg');
  document.body.appendChild(s);setTimeout(function(){s.remove()},1000);
}
document.addEventListener('pointerdown',function(e){for(var i=0;i<5;i++)sparkle(e.clientX,e.clientY)});
setInterval(function(){
  var t=document.querySelector('#s2.on .env:not(.away)')||document.querySelector('#s2.on #panda.show:not(.popped)')||document.querySelector('#s4.on .letter');
  if(!t)return;
  var r=t.getBoundingClientRect(),h=document.createElement('span');
  h.className='up';h.textContent=['💗','💜','💕','✨'][(Math.random()*4)|0];
  h.style.left=(r.left+Math.random()*r.width)+'px';h.style.top=(r.top+r.height*.3)+'px';
  h.style.fontSize=(14+Math.random()*14)+'px';h.style.animationDuration=(2.2+Math.random()*1.5)+'s';
  document.body.appendChild(h);setTimeout(function(){h.remove()},4000);
},450);
(function(){
  var c=document.getElementById('amb'),x=c.getContext('2d'),H=[],S=[];
  function size(){c.width=innerWidth;c.height=innerHeight}
  size();addEventListener('resize',size);
  for(var i=0;i<26;i++)H.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,v:.25+Math.random()*.6,s:10+Math.random()*18,a:.2+Math.random()*.4,ph:Math.random()*7,sw:.4+Math.random()});
  for(var j=0;j<45;j++)S.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.8+Math.random()*1.8,ph:Math.random()*7,sp:.02+Math.random()*.04});
  var t=0;
  (function loop(){
    t++;x.clearRect(0,0,c.width,c.height);
    S.forEach(function(s){x.globalAlpha=.25+.55*Math.abs(Math.sin(t*s.sp+s.ph));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});
    H.forEach(function(h){
      h.y-=h.v;if(h.y<-30){h.y=c.height+30;h.x=Math.random()*c.width}
      var dx=Math.sin(t*.01*h.sw+h.ph)*18;
      x.globalAlpha=h.a;x.fillStyle='#ffc2ec';x.font=h.s+'px sans-serif';x.fillText('♥',h.x+dx,h.y);
    });
    requestAnimationFrame(loop);
  })();
})();
